server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/poetry_clean?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root       # 你的MySQL用户名（默认root）
    password: 123456     # 你的MySQL密码！
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    default-property-inclusion: non_null

logging:
  level:
    root: info
    com.example.poetry.backend: debug

security:
  jwt:
    # Must be long enough for HMAC-SHA (>= 32 bytes). Base64 also supported.
    secret: "poetry-dev-secret-please-change-32bytes-minimum-2026-04-27"
    expiration-seconds: 604800
